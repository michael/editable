allowBuilds:
  esbuild: true
# Svedit releases are intentional application dependencies even while they are
# inside pnpm's minimum release age window.
minimumReleaseAgeExclude:
  - svedit
  - '@sveltejs/adapter-static@4.0.0'
  - '@sveltejs/kit@3.0.0'
  - '@sveltejs/adapter-node@6.0.0'
  - '@types/node@26.6.4'
  - globals@17.13.0
  - vite@8.3.2
