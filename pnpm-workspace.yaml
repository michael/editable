allowBuilds:
  esbuild: true
# Svedit releases are intentional application dependencies even while they are
# inside pnpm's minimum release age window. Exact versions let one fresh release
# through; remove them once the lockfile has moved past them.
minimumReleaseAgeExclude:
  - svedit
  - svelte@5.58.0
  - esrap@2.4.2

# Tailwind pins a parser that warns about the standard ::highlight() selector.
overrides:
  '@tailwindcss/node>lightningcss': 1.33.0
